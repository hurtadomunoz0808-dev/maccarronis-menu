<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;scroll-padding-top:150px;overscroll-behavior-y:none}
:root{--bg:#14110D;--pnl:rgba(24,20,15,.86);--gold:#D8BA76;--goldHi:#F0D79E;
 --goldDim:rgba(216,186,118,.42);--ivory:#F5EDDD;--muted:#A2957E;
 --line:rgba(216,186,118,.15);--wa:#1F9E52}
body{background:var(--bg) center top/cover;background-attachment:scroll;font-family:'Lato',sans-serif;color:var(--ivory);
 -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
@media(max-width:500px){body{background-attachment:scroll;background-size:100% auto;background-repeat:repeat-y}}
#splash{position:fixed;inset:0;z-index:2000;background:var(--bg) center/cover;display:grid;place-items:center;
 cursor:pointer;transition:opacity .85s ease,transform .85s ease}
#splash.out{opacity:0;pointer-events:none;transform:scale(1.06)}
#splash::after{content:'';position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(ellipse at 50% 45%,transparent 25%,rgba(8,6,4,.6) 100%)}
.sp-in{position:relative;z-index:1;text-align:center;padding:0 24px}
.sp-logo{width:min(330px,74vw);display:block;margin:0 auto;
 animation:lin 1.5s cubic-bezier(.16,.84,.28,1) both;filter:drop-shadow(0 8px 34px rgba(216,186,118,.28))}
@keyframes lin{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
.sp-cta{margin-top:46px;font-size:9.5px;font-weight:700;letter-spacing:.36em;text-transform:uppercase;
 color:var(--goldDim);animation:bl 2.4s ease 1.1s infinite}
@keyframes bl{0%,100%{opacity:.45}50%{opacity:1}}
#app{max-width:470px;margin:0 auto;min-height:100vh}
@media(min-width:471px){#app{box-shadow:0 0 90px rgba(0,0,0,.75)}}
.hdr{position:sticky;top:0;z-index:100;background:rgba(17,14,10,.93);backdrop-filter:blur(16px);
 -webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:9px 15px}
.hdr img{height:32px;width:auto;object-fit:contain;cursor:pointer}
.hdr-sp{flex:1}
.hdr-wa{width:35px;height:35px;background:var(--wa);border-radius:50%;display:grid;place-items:center;
 text-decoration:none;flex-shrink:0}
.sw{padding:12px 15px 6px;position:sticky;top:53px;z-index:96;
 background:linear-gradient(rgba(17,14,10,.93) 72%,rgba(17,14,10,0))}
.sb{display:flex;align-items:center;gap:10px;background:rgba(32,27,20,.92);border:1px solid var(--line);
 border-radius:26px;padding:9px 15px;transition:border-color .25s}
.sb:focus-within{border-color:var(--goldDim)}
.sb input{flex:1;background:none;border:none;outline:none;color:var(--ivory);font-family:'Lato';font-size:13.5px}
.sb input::placeholder{color:var(--muted);font-style:italic}
.sx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;display:none;line-height:1}
.sb.q .sx{display:block}
.nv{position:sticky;top:105px;z-index:94;background:rgba(17,14,10,.92);backdrop-filter:blur(12px);
 -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nvs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px}
.nvs::-webkit-scrollbar{display:none}
.np{flex-shrink:0;padding:11px 12px;font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
 color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;
 transition:all .22s;white-space:nowrap}
.np.on{color:var(--goldHi);border-bottom-color:var(--gold)}
.top{position:relative;height:220px;display:grid;place-items:center;overflow:hidden}
.top-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.top::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(16,13,9,.62),rgba(16,13,9,.88))}
.top-in{position:relative;z-index:2;text-align:center;padding:0 22px}
.top-in img{width:min(250px,62vw);filter:drop-shadow(0 4px 20px rgba(0,0,0,.6))}
.top-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13.5px;color:var(--goldDim);
 letter-spacing:.14em;margin-top:8px}
main{padding-bottom:110px}
.sec{margin:0 11px 12px;background:var(--pnl);border:1px solid var(--line);border-radius:18px;overflow:hidden;
 opacity:0;transform:translateY(26px);transition:opacity .65s ease,transform .65s ease}
.sec.vis{opacity:1;transform:none}
.shd{position:relative;height:172px;display:flex;align-items:flex-end;justify-content:center}
.shd-img{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);
 transition:transform 8s ease}
.sec.vis .shd-img{transform:scale(1)}
.shd::after{content:'';position:absolute;inset:0;
 background:linear-gradient(rgba(16,13,9,.18) 0%,rgba(16,13,9,.6) 55%,rgba(20,17,13,.96) 100%)}
.shd-in{position:relative;z-index:2;text-align:center;padding:0 20px 16px;width:100%}
.orn{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:7px}
.orn i{display:block;height:1px;width:34px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i+i{background:linear-gradient(90deg,var(--gold),transparent)}
.orn b{color:var(--gold);font-size:7px;letter-spacing:3px}
.st{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--goldHi);letter-spacing:.05em;
 line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.65)}
.ss{font-size:8px;font-weight:700;color:rgba(216,186,118,.72);letter-spacing:.28em;text-transform:uppercase;
 margin-top:6px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.ghd{padding:15px 20px 2px}
.gt{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;font-weight:600;color:var(--gold)}
.gs{font-size:8px;font-weight:700;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;margin-top:2px}
.its{padding:6px 20px 18px}
.it{padding:13px 0;border-bottom:1px solid rgba(216,186,118,.08)}
.it:last-child{border-bottom:none}
.it.hd{display:none}
.itr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:3px}
.itn{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17.5px;font-weight:600;color:var(--ivory);
 flex:1;line-height:1.2}
.itp{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--gold);white-space:nowrap}
.itd{font-size:11.5px;font-weight:300;color:var(--muted);line-height:1.5}
.chef{display:inline-block;font-size:7.5px;font-weight:700;letter-spacing:.07em;background:rgba(216,186,118,.13);
 color:var(--goldHi);padding:2.5px 7px;border-radius:9px;margin-left:6px;vertical-align:middle;font-style:normal;
 border:.5px solid rgba(216,186,118,.28)}
.bg1{font-size:8.5px;font-weight:900;color:var(--gold);letter-spacing:.26em;text-transform:uppercase;padding:15px 20px 5px}
.bv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6.5px 20px;
 border-bottom:1px solid rgba(216,186,118,.055)}
.bvn{font-size:12.5px;color:var(--ivory)}
.bvp{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;color:var(--gold)}
.vn{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 20px;
 border-bottom:1px solid rgba(216,186,118,.07)}
.vnn{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14.5px;color:var(--ivory);flex:1}
.vnf{font-size:12px;margin-left:5px}
.vnp{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--gold)}
.lg{font-size:9.5px;color:var(--muted);text-align:center;padding:14px 24px 8px;font-style:italic;line-height:1.5}
.nores{display:none;text-align:center;padding:44px 24px;color:var(--muted);font-family:'Cormorant Garamond',serif;
 font-style:italic;font-size:18px}
.nores.on{display:block}
.ftr{margin:16px 11px 0;background:var(--pnl);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ftr-top{position:relative;height:150px;display:grid;place-items:center}
.ftr-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.ftr-top::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(16,13,9,.55),rgba(24,20,15,.95))}
.ftr-top img{position:relative;z-index:2;width:min(210px,54vw);filter:drop-shadow(0 4px 16px rgba(0,0,0,.6))}
.ftr-bd{padding:22px 22px 30px;text-align:center}
.htb{width:100%;border-collapse:collapse;margin-bottom:18px}
.htb td{font-size:11.5px;padding:5px 0}
.htb td:first-child{color:var(--muted);text-align:left}
.htb td:last-child{color:var(--goldHi);font-weight:700;text-align:right}
.fad{font-size:11.5px;color:var(--muted);line-height:1.8;margin-bottom:20px;text-decoration:none;display:block}
.fwa{display:inline-flex;align-items:center;gap:9px;background:var(--wa);color:#fff;font-weight:700;font-size:13.5px;
 padding:13px 28px;border-radius:30px;text-decoration:none;box-shadow:0 6px 24px rgba(31,158,82,.3)}
.fig{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;text-decoration:none;
 letter-spacing:.05em;margin-top:18px}
.fc{font-size:9.5px;color:rgba(162,149,126,.42);margin-top:20px;letter-spacing:.06em}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:max(15px,calc(50vw - 219px));z-index:300;
 width:53px;height:53px;background:var(--wa);border-radius:50%;display:grid;place-items:center;
 box-shadow:0 8px 26px rgba(31,158,82,.42);text-decoration:none;transition:transform .18s}
.fab:active{transform:scale(.9)}

/* ═══ ADMINISTRADOR ═══ */
#adm{position:fixed;inset:0;z-index:5000;background:#0F0D0A;display:none;flex-direction:column;
 font-family:'Lato',sans-serif;color:#F5EDDD}
#adm.on{display:flex}
.a-hd{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#17130E;
 border-bottom:1px solid var(--line);flex-shrink:0}
.a-hd h1{font-size:14px;font-weight:900;letter-spacing:.14em;color:var(--gold);flex:1}
.a-tabs{display:flex;overflow-x:auto;background:#17130E;border-bottom:1px solid var(--line);
 flex-shrink:0;scrollbar-width:none}
.a-tabs::-webkit-scrollbar{display:none}
.a-tab{flex-shrink:0;padding:11px 15px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);
 background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.a-tab.on{color:var(--goldHi);border-bottom-color:var(--gold)}
.a-bd{flex:1;overflow-y:auto;padding:16px;max-width:820px;width:100%;margin:0 auto}
.a-pane{display:none}
.a-pane.on{display:block}
.a-card{background:#1B1712;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.a-card h3{font-size:13px;font-weight:700;color:var(--goldHi);margin-bottom:10px;display:flex;
 align-items:center;justify-content:space-between;gap:8px}
.a-f{margin-bottom:10px}
.a-f label{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
 color:var(--muted);margin-bottom:4px}
.a-f input,.a-f textarea,.a-f select{width:100%;background:#24201A;border:1px solid var(--line);border-radius:8px;
 padding:9px 11px;color:#F5EDDD;font-family:'Lato';font-size:13.5px;outline:none}
.a-f input:focus,.a-f textarea:focus{border-color:var(--gold)}
.a-f textarea{resize:vertical;min-height:54px}
.a-row{display:grid;grid-template-columns:1fr 110px;gap:8px}
.a-item{background:#211C16;border:1px solid rgba(216,186,118,.1);border-radius:10px;padding:11px;margin-bottom:9px}
.a-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.a-top span{flex:1;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.btn{background:#2A241C;border:1px solid var(--line);color:var(--goldHi);font-family:'Lato';font-size:12px;
 font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;transition:all .15s}
.btn:hover{background:#352D22;border-color:var(--gold)}
.btn.p{background:var(--gold);color:#1A1509;border-color:var(--gold)}
.btn.p:hover{background:var(--goldHi)}
.btn.d{color:#E08A8A;border-color:rgba(224,138,138,.3)}
.btn.s{padding:5px 9px;font-size:11px}
.a-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.a-chef{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;
 user-select:none;padding:4px 0}
.a-chef input{width:17px;height:17px;accent-color:var(--gold);cursor:pointer}
.a-ph{display:flex;gap:12px;align-items:center;margin-bottom:12px;background:#1B1712;
 border:1px solid var(--line);border-radius:12px;padding:12px}
.a-ph img{width:120px;height:44px;object-fit:cover;border-radius:7px;flex-shrink:0;background:#24201A}
.a-ph .i{flex:1;min-width:0}
.a-ph b{display:block;font-size:12.5px;color:var(--goldHi);margin-bottom:5px}
.a-note{font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.a-warn{background:rgba(216,186,118,.08);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
 font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:14px}
.a-warn b{color:var(--goldHi)}
.a-ok{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--gold);
 color:#1A1509;font-size:12.5px;font-weight:700;padding:11px 22px;border-radius:24px;z-index:6000;
 transition:transform .35s cubic-bezier(.2,.9,.3,1);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.a-ok.on{transform:translateX(-50%) translateY(0)}
#gate{position:fixed;inset:0;z-index:5500;background:#0F0D0A;display:none;place-items:center;padding:24px}
#gate.on{display:grid}
.g-box{text-align:center;max-width:300px;width:100%}
.g-box img{width:190px;margin-bottom:26px}
.g-box input{width:100%;background:#24201A;border:1px solid var(--line);border-radius:10px;padding:13px;
 color:#F5EDDD;font-size:19px;text-align:center;letter-spacing:.5em;outline:none;font-family:'Lato'}
.g-box input:focus{border-color:var(--gold)}
.g-err{font-size:12px;color:#E08A8A;margin-top:10px;min-height:16px}
</style>
</head>

<div id="adm">
  <div class="a-hd">
    <h1>ADMINISTRADOR</h1>
    <button class="btn s" onclick="preview()">Ver menú</button>
    <button class="btn s" onclick="closeAdm()">Salir</button>
  </div>
  <div class="a-tabs" id="aTabs"></div>
  <div class="a-bd" id="aBody"></div>
</div>
<div class="a-ok" id="okMsg"></div>

<script>
const $=s=>document.querySelector(s);
const fmt=p=>'$'+Number(p||0).toLocaleString('es-CO');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let D = { R:RESTAURANTE, C:CATEGORIAS, B:BEBIDAS, V:VINOS, H:HEROES, L:LOGO };
try{ const d=localStorage.getItem('mcr_draft'); if(d){ const p=JSON.parse(d); if(p&&p.R&&p.C) D=p; } }catch(e){}
const save=()=>{ try{ localStorage.setItem('mcr_draft',JSON.stringify(D)); }catch(e){ toast('Borrador muy pesado para guardar'); } };

function toast(m){ const o=$('#okMsg'); o.textContent=m; o.classList.add('on');
  clearTimeout(o._t); o._t=setTimeout(()=>o.classList.remove('on'),2200); }

/* ─── RENDER DEL MENÚ ─── */
function itH(it){
  const c=it.chef?' <span class="chef">&#9733; Chef</span>':'';
  const d=it.d?'<div class="itd">'+esc(it.d)+'</div>':'';
  return '<div class="it" data-s="'+esc((it.n+' '+(it.d||'')).toLowerCase())+'">'+
   '<div class="itr"><div class="itn">'+esc(it.n)+c+'</div><div class="itp">'+fmt(it.p)+'</div></div>'+d+'</div>';
}
function hdH(id,t,s){
  const bg=D.H[id]?' style="background-image:url(\''+D.H[id]+'\')"':'';
  return '<div class="shd"><div class="shd-img"'+bg+'></div><div class="shd-in">'+
   '<div class="orn"><i></i><b>&#10022; &#10022; &#10022;</b><i></i></div>'+
   '<div class="st">'+esc(t)+'</div><div class="ss">'+esc(s)+'</div></div></div>';
}
function render(){
  document.body.style.backgroundImage="url('"+D.H.fondo+"')";
  $('#splash').style.backgroundImage="url('"+D.H.fondo+"')";
  ['splLogo','hdrLogo','topLogo','ftrLogo','gateLogo'].forEach(i=>$('#'+i).src=D.L);
  $('#topBg').style.backgroundImage="url('"+D.H.fachada+"')";
  $('#ftrBg').style.backgroundImage="url('"+D.H.fachada+"')";
  $('#lema').textContent=D.R.lema;
  const WA='https://wa.me/'+D.R.whatsapp+'?text='+encodeURIComponent(D.R.mensajeWA);
  ['waT','waB','fabWa'].forEach(i=>$('#'+i).href=WA);
  $('#igB').href='https://instagram.com/'+D.R.instagram;
  $('#igH').textContent='@'+D.R.instagram;
  $('#fad').innerHTML=esc(D.R.direccion).split('·').join('<br>');
  $('#fad').href=D.R.maps;
  $('#htb').innerHTML=D.R.horarios.map(h=>'<tr><td>'+esc(h[0])+'</td><td>'+esc(h[1])+'</td></tr>').join('');
  $('#fc').textContent='\u00A9 '+new Date().getFullYear()+' '+D.R.nombre+' \u00B7 Cali, Colombia';

  let nav='',mn='';
  D.C.forEach((c,i)=>{
    nav+='<button class="np'+(i?'':' on')+'" data-t="'+c.id+'">'+esc(c.nombre)+'</button>';
    let b='';
    if(c.grupos) c.grupos.forEach(g=>{ b+='<div class="ghd"><div class="gt">'+esc(g.g)+'</div><div class="gs">'+esc(g.gs||'')+'</div></div><div class="its">'+g.items.map(itH).join('')+'</div>'; });
    else b='<div class="its">'+(c.items||[]).map(itH).join('')+'</div>';
    mn+='<section class="sec" id="'+c.id+'">'+hdH(c.id,c.nombre,c.sub)+b+'<div class="lg">'+esc(D.R.notaLegal)+'</div></section>';
  });
  nav+='<button class="np" data-t="bebidas">Bebidas</button><button class="np" data-t="vinos">Vinos</button>';
  mn+='<section class="sec" id="bebidas">'+hdH('bebidas','Bevande','Bebidas')+
    D.B.map(g=>'<div class="bg1">'+esc(g.g)+'</div>'+g.items.map(b=>'<div class="bv it" data-s="'+esc(b.n.toLowerCase())+'"><span class="bvn">'+esc(b.n)+'</span><span class="bvp">'+fmt(b.p)+'</span></div>').join('')).join('')+
    '<div class="lg">'+esc(D.R.notaLegal)+'</div></section>';
  mn+='<section class="sec" id="vinos">'+hdH('vinos','Carta de Vinos','Botellas 750ml')+
    D.V.map(g=>'<div class="bg1">'+esc(g.g)+'</div>'+g.items.map(v=>'<div class="vn it" data-s="'+esc(v.n.toLowerCase())+'"><span class="vnn">'+esc(v.n)+'<span class="vnf">'+(v.f||'')+'</span></span><span class="vnp">'+fmt(v.p)+'</span></div>').join('')).join('')+
    '<div class="lg">'+esc(D.R.notaLegal)+'</div></section>';
  $('#nvs').innerHTML=nav; $('#main').innerHTML=mn; wire();
}
function centerPill(p){
  const nv=$('#nvs'); if(!nv||!p) return;
  const l=p.offsetLeft-(nv.clientWidth-p.offsetWidth)/2;
  nv.scrollTo({left:Math.max(0,l),behavior:'smooth'});
}
function layout(){
  const hd=$('.hdr'),sw=$('.sw'),nv=$('.nv');
  if(!hd||!sw||!nv) return;
  const hh=hd.offsetHeight;
  sw.style.top=hh+'px';
  nv.style.top=(hh+sw.offsetHeight)+'px';
  document.documentElement.style.scrollPaddingTop=(hh+sw.offsetHeight+nv.offsetHeight+8)+'px';
}
function wire(){
  const P=Array.from(document.querySelectorAll('.np')),S=Array.from(document.querySelectorAll('.sec'));
  layout();
  P.forEach(p=>p.onclick=()=>{
    const t=document.getElementById(p.dataset.t); if(!t)return;
    layout();
    const o=$('.hdr').offsetHeight+$('.sw').offsetHeight+$('.nv').offsetHeight-38;
    scrollTo({top:t.getBoundingClientRect().top+scrollY-o,behavior:'smooth'});
    P.forEach(x=>x.classList.remove('on')); p.classList.add('on');
    centerPill(p);
  });
  let last=null;
  const spy=new IntersectionObserver(e=>e.forEach(x=>{ if(x.isIntersecting){
    const m=document.querySelector('[data-t="'+x.target.id+'"]');
    if(m&&m!==last){ last=m; P.forEach(y=>y.classList.remove('on')); m.classList.add('on'); centerPill(m); }
  }}),{rootMargin:'-42% 0px -46% 0px'});
  S.forEach(s=>spy.observe(s));
  if('IntersectionObserver' in window){
    const rev=new IntersectionObserver(e=>e.forEach(x=>{ if(x.isIntersecting){x.target.classList.add('vis');rev.unobserve(x.target);} }),{threshold:.04});
    S.forEach(s=>rev.observe(s));
    setTimeout(()=>S.forEach(s=>{ if(s.getBoundingClientRect().top<innerHeight*1.2) s.classList.add('vis'); }),400);
  } else S.forEach(s=>s.classList.add('vis'));
  addEventListener('resize',layout,{passive:true});
  const q=$('#q'),sb=$('#sb');
  q.oninput=()=>{
    const v=q.value.trim().toLowerCase();
    sb.classList.toggle('q',!!v);
    let any=false;
    document.querySelectorAll('.it').forEach(i=>{ const h=!v||i.dataset.s.includes(v); i.classList.toggle('hd',!h); if(h)any=true; });
    S.forEach(s=>{ const has=s.querySelector('.it:not(.hd)'); s.style.display=(v&&!has)?'none':''; if(v)s.classList.add('vis'); });
    $('#nores').classList.toggle('on',!!v&&!any);
  };
  $('#qx').onclick=()=>{q.value='';q.dispatchEvent(new Event('input'));q.blur();};
  let taps=0,tt;
  $('#hdrLogo').onclick=()=>{ taps++; clearTimeout(tt); tt=setTimeout(()=>taps=0,900); if(taps>=5){taps=0;askPin();} };
}
function go(){const s=$('#splash'); if(!s)return; s.classList.add('out'); $('#app').hidden=false; layout();
  setTimeout(()=>{ if(s.parentNode) s.remove(); layout(); },900); }

/* ─── ACCESO ADMIN ─── */
function askPin(){ $('#gate').classList.add('on'); $('#pin').value=''; $('#pinErr').textContent=''; setTimeout(()=>$('#pin').focus(),120); }
$('#pin').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if($('#pin').value===String(D.R.pin)){ $('#gate').classList.remove('on'); openAdm(); }
  else { $('#pinErr').textContent='PIN incorrecto'; $('#pin').value=''; }
});
$('#gate').addEventListener('click',e=>{ if(e.target.id==='gate') $('#gate').classList.remove('on'); });
function openAdm(){ $('#adm').classList.add('on'); buildAdm(); }
function closeAdm(){ $('#adm').classList.remove('on'); if(location.hash==='#admin') history.replaceState(null,'',location.pathname); }
function preview(){ $('#adm').classList.remove('on'); render(); toast('Vista previa — vuelve con #admin'); }

/* ─── PANEL ─── */
const TABS=[['info','Restaurante'],['menu','Menú'],['beb','Bebidas'],['vin','Vinos'],['fotos','Fotos'],['exp','Publicar']];
let curTab='info';
function buildAdm(){
  $('#aTabs').innerHTML=TABS.map(t=>'<button class="a-tab'+(t[0]===curTab?' on':'')+'" data-p="'+t[0]+'">'+t[1]+'</button>').join('');
  document.querySelectorAll('.a-tab').forEach(b=>b.onclick=()=>{curTab=b.dataset.p;buildAdm();});
  $('#aBody').innerHTML=({info:paneInfo,menu:paneMenu,beb:paneBeb,vin:paneVin,fotos:paneFotos,exp:paneExp})[curTab]();
  bindAdm();
}
const fld=(l,v,path,t)=>'<div class="a-f"><label>'+l+'</label>'+
  (t==='area'?'<textarea data-p="'+path+'">'+esc(v)+'</textarea>':'<input type="'+(t||'text')+'" data-p="'+path+'" value="'+esc(v)+'">')+'</div>';

function paneInfo(){

function paneMenu(){
  let h='<div class="a-warn">Los cambios se guardan solos en este navegador. Para que los vean los clientes, ve a <b>Publicar</b>.</div>';

    h+='<div class="a-card"><h3>'+esc(c.nombre)+'<button class="btn d s" data-del="cat:'+ci+'">Borrar categoría</button></h3>'+
      '<div class="a-row"><div class="a-f"><label>Nombre</label><input data-p="C.'+ci+'.nombre" value="'+esc(c.nombre)+'"></div>'+
      '<div class="a-f"><label>ID</label><input data-p="C.'+ci+'.id" value="'+esc(c.id)+'"></div></div>'+
      fld('Subtítulo',c.sub,'C.'+ci+'.sub');
    if(c.grupos){
      c.grupos.forEach((g,gi)=>{
        h+='<div style="margin:12px 0 4px;padding-left:10px;border-left:2px solid rgba(216,186,118,.3)">'+
          '<div class="a-row"><div class="a-f"><label>Subgrupo</label><input data-p="C.'+ci+'.grupos.'+gi+'.g" value="'+esc(g.g)+'"></div>'+
          '<div class="a-f"><label>&nbsp;</label><button class="btn d s" data-del="grp:'+ci+':'+gi+'">Quitar</button></div></div>'+
          fld('Descripción',g.gs||'','C.'+ci+'.grupos.'+gi+'.gs');
        g.items.forEach((it,ii)=> h+=itemForm(it,'C.'+ci+'.grupos.'+gi+'.items.'+ii));
        h+='<div class="a-acts"><button class="btn" data-add="it:C.'+ci+'.grupos.'+gi+'.items">+ Plato</button></div></div>';
      });
      h+='<div class="a-acts"><button class="btn" data-add="grp:'+ci+'">+ Subgrupo</button></div>';
    } else {
      (c.items||[]).forEach((it,ii)=> h+=itemForm(it,'C.'+ci+'.items.'+ii));
      h+='<div class="a-acts"><button class="btn" data-add="it:C.'+ci+'.items">+ Plato</button></div>';
    }
    h+='</div>';
  });
  h+='<div class="a-acts"><button class="btn p" data-add="cat">+ Nueva categoría</button></div>';

function simpleGroups(arr,key,label,wine){

  arr.forEach((g,gi)=>{
    h+='<div class="a-card"><h3>'+esc(g.g)+'<button class="btn d s" data-del="'+key+'g:'+gi+'">Borrar grupo</button></h3>'+
      fld('Nombre del grupo',g.g,key+'.'+gi+'.g');
    g.items.forEach((it,ii)=>{
      h+='<div class="a-item"><div class="a-top"><span>'+label+'</span>'+
        '<button class="btn s" data-mv="'+key+'.'+gi+'.items.'+ii+':-1">&#8593;</button>'+
        '<button class="btn s" data-mv="'+key+'.'+gi+'.items.'+ii+':1">&#8595;</button>'+
        '<button class="btn d s" data-del="it:'+key+'.'+gi+'.items.'+ii+'">Borrar</button></div>'+
        '<div class="a-row"><div class="a-f"><label>Nombre</label><input data-p="'+key+'.'+gi+'.items.'+ii+'.n" value="'+esc(it.n)+'"></div>'+
        '<div class="a-f"><label>Precio</label><input type="number" data-p="'+key+'.'+gi+'.items.'+ii+'.p" value="'+(it.p||0)+'"></div></div>'+
        (wine?'<div class="a-f"><label>Bandera (emoji)</label><input data-p="'+key+'.'+gi+'.items.'+ii+'.f" value="'+esc(it.f||'')+'"></div>':'')+
        '</div>';
    });
    h+='<div class="a-acts"><button class="btn" data-add="it:'+key+'.'+gi+'.items">+ '+label.toLowerCase()+'</button></div></div>';
  });
  h+='<div class="a-acts"><button class="btn p" data-add="'+key+'g">+ Nuevo grupo</button></div>';
  return h;
}
const paneBeb=()=>simpleGroups(D.B,'B','BEBIDA',false);
const paneVin=()=>simpleGroups(D.V,'V','VINO',true);

    '<div class="a-note">Descarta los cambios no publicados y vuelve a la última versión del archivo.</div>'+

/* ─── BINDINGS ─── */
function getRef(path){ const k=path.split('.'); let o=D; for(let i=0;i<k.length-1;i++) o=o[k[i]]; return [o,k[k.length-1]]; }
function bindAdm(){
  $('#aBody').querySelectorAll('[data-p]').forEach(el=>{
    const h=()=>{ const [o,k]=getRef(el.dataset.p);
      o[k]= el.type==='checkbox' ? el.checked : (el.type==='number' ? Number(el.value||0) : el.value);
      if(el.type==='checkbox'&&!el.checked) delete o[k];
      save(); };
    el.addEventListener(el.type==='checkbox'?'change':'input',h);
  });
  $('#aBody').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.add;
    if(v==='hor') D.R.horarios.push(['Nuevo','12:00 – 3:00 pm']);
    else if(v==='cat') D.C.push({id:'cat'+Date.now(),nombre:'Nueva categoría',sub:'Subtítulo',items:[{n:'Nuevo plato',d:'',p:0}]});
    else if(v==='Bg') D.B.push({g:'Nuevo grupo',items:[{n:'Nueva bebida',p:0}]});
    else if(v==='Vg') D.V.push({g:'Nuevo grupo',items:[{n:'Nuevo vino',f:'\u{1F1EE}\u{1F1F9}',p:0}]});
    else if(v.startsWith('grp:')){ const ci=+v.split(':')[1]; D.C[ci].grupos.push({g:'Nuevo subgrupo',gs:'',items:[{n:'Nuevo plato',d:'',p:0}]}); }
    else if(v.startsWith('it:')){ const p=v.slice(3); const k=p.split('.'); let o=D; k.forEach(x=>o=o[x]);
      o.push(p.startsWith('V')?{n:'Nuevo vino',f:'\u{1F1EE}\u{1F1F9}',p:0}:(p.startsWith('B')?{n:'Nuevo',p:0}:{n:'Nuevo plato',d:'',p:0})); }
    save(); buildAdm(); toast('Agregado');
  });
  $('#aBody').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.del;
    if(v.startsWith('hor:')) D.R.horarios.splice(+v.split(':')[1],1);
    else if(v.startsWith('cat:')){ if(!confirm('¿Borrar toda la categoría?'))return; D.C.splice(+v.split(':')[1],1); }
    else if(v.startsWith('grp:')){ const [,ci,gi]=v.split(':'); if(!confirm('¿Borrar el subgrupo?'))return; D.C[+ci].grupos.splice(+gi,1); }
    else if(v.startsWith('Bg:')) { if(!confirm('¿Borrar el grupo?'))return; D.B.splice(+v.split(':')[1],1); }
    else if(v.startsWith('Vg:')) { if(!confirm('¿Borrar el grupo?'))return; D.V.splice(+v.split(':')[1],1); }
    else if(v.startsWith('it:')){ const p=v.slice(3); const k=p.split('.'); let o=D;
      for(let i=0;i<k.length-1;i++) o=o[k[i]]; o.splice(+k[k.length-1],1); }
    save(); buildAdm(); toast('Eliminado');
  });
  $('#aBody').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    const [p,dir]=b.dataset.mv.split(':'); const k=p.split('.'); let o=D;
    for(let i=0;i<k.length-1;i++) o=o[k[i]];
    const i=+k[k.length-1], j=i+ +dir;
    if(j<0||j>=o.length)return;
    [o[i],o[j]]=[o[j],o[i]]; save(); buildAdm();
  });
  $('#aBody').querySelectorAll('[data-hero]').forEach(inp=>inp.onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const k=inp.dataset.hero;
    const dims = k==='fondo'?[640,1138]:(k==='fachada'?[860,300]:[860,300]);
    resize(f,dims[0],dims[1],.62,url=>{ D.H[k]=url; save(); buildAdm(); toast('Foto actualizada'); });
  });
  const lg=$('#aBody').querySelector('[data-logo]');
  if(lg) lg.onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{ D.L=r.result; save(); buildAdm(); toast('Logo actualizado'); }; r.readAsDataURL(f); };
  const be=$('#btnExp'); if(be) be.onclick=exportHTML;
  const bj=$('#btnJson'); if(bj) bj.onclick=()=>dl(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),'maccarronis-respaldo.json');
  const br=$('#btnReset'); if(br) br.onclick=()=>{ if(!confirm('¿Descartar todos los cambios no publicados?'))return;
    localStorage.removeItem('mcr_draft'); location.reload(); };
}
function resize(file,W,H,q,cb){
  const r=new FileReader();
  r.onload=()=>{ const im=new Image();
    im.onload=()=>{ const c=document.createElement('canvas'); c.width=W; c.height=H;
      const x=c.getContext('2d'); const tr=W/H, ir=im.width/im.height;
      let sw,sh,sx,sy;
      if(ir>tr){ sh=im.height; sw=sh*tr; sx=(im.width-sw)/2; sy=0; }
      else { sw=im.width; sh=sw/tr; sx=0; sy=(im.height-sh)*0.4; }
      x.drawImage(im,sx,sy,sw,sh,0,0,W,H);
      cb(c.toDataURL('image/jpeg',q)); };
    im.src=r.result; };
  r.readAsDataURL(file);
}
function dl(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),3000); }
async function exportHTML(){
  let src=null;
  try{ const r=await fetch(location.href,{cache:'no-store'}); if(r.ok) src=await r.text(); }catch(e){}
  if(!src||src.indexOf('__DATA_START__')<0){
    toast('Abre el menú desde su link web para exportar'); return;
  }
  const dataB='/*__DATA_START__*/\n'+
    'const RESTAURANTE = '+JSON.stringify(D.R)+';\n'+
    'const CATEGORIAS = '+JSON.stringify(D.C)+';\n'+
    'const BEBIDAS = '+JSON.stringify(D.B)+';\n'+
    'const VINOS = '+JSON.stringify(D.V)+';\n'+
    '/*__DATA_END__*/';
  const medB='/*__MEDIA_START__*/\n'+
    'const HEROES = '+JSON.stringify(D.H)+';\n'+
    'const LOGO = '+JSON.stringify(D.L)+';\n'+
    '/*__MEDIA_END__*/';
  src=src.replace(/\/\*__DATA_START__\*\/[\s\S]*?\/\*__DATA_END__\*\//,()=>dataB)
         .replace(/\/\*__MEDIA_START__\*\/[\s\S]*?\/\*__MEDIA_END__\*\//,()=>medB);
  dl(new Blob([src],{type:'text/html;charset=utf-8'}),'index.html');
  toast('Descargado — súbelo a tu hosting');
}

render();
if(location.hash==='#admin'){ $('#splash').remove(); $('#app').hidden=false; askPin(); }
else setTimeout(go,4200);
</script>
